<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#451a03"/>
      <stop offset="1" stop-color="#713f12"/>
    </linearGradient>
    <radialGradient id="glow3" cx="75%" cy="20%" r="60%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="560" fill="url(#bg3)"/>
  <rect width="400" height="560" fill="url(#glow3)"/>

  <!-- Geometric math pattern: dots grid -->
  <circle cx="60" cy="200" r="3" fill="rgba(253,230,138,0.12)"/>
  <circle cx="100" cy="200" r="3" fill="rgba(253,230,138,0.12)"/>
  <circle cx="140" cy="200" r="3" fill="rgba(253,230,138,0.12)"/>
  <circle cx="60" cy="240" r="3" fill="rgba(253,230,138,0.12)"/>
  <circle cx="100" cy="240" r="3" fill="rgba(253,230,138,0.12)"/>
  <circle cx="140" cy="240" r="3" fill="rgba(253,230,138,0.12)"/>
  <!-- Triangle shapes -->
  <polygon points="330,190 360,240 300,240" fill="rgba(253,230,138,0.07)"/>
  <polygon points="340,170 380,240 300,240" fill="rgba(253,230,138,0.04)"/>
  <!-- Large circle -->
  <circle cx="340" cy="450" r="100" fill="rgba(253,230,138,0.05)"/>
  <circle cx="50" cy="460" r="60" fill="rgba(255,255,255,0.03)"/>

  <!-- Top accent -->
  <rect y="0" width="400" height="5" fill="#fde68a"/>

  <!-- PREVIEW band -->
  <rect y="12" width="400" height="22" fill="rgba(0,0,0,0.3)"/>
  <text x="200" y="27" text-anchor="middle" font-size="9" fill="rgba(253,230,138,0.85)"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" letter-spacing="4">
    EXAMPLE · PREVIEW ONLY · NOT A REAL EVENT
  </text>

  <!-- Org header -->
  <text x="200" y="72" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="2.5" font-weight="500">
    INDIAN ACADEMY OF SCIENCES
  </text>
  <text x="200" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.8)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="2" font-weight="700">
    THE ACADEMY TRUST (tAcT)
  </text>

  <line x1="60" y1="104" x2="340" y2="104" stroke="rgba(253,230,138,0.3)" stroke-width="1"/>

  <!-- Program name -->
  <text x="200" y="148" text-anchor="middle" font-size="28" fill="#fde68a"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1">
    GANITHA MELA
  </text>
  <text x="200" y="170" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.5)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="2">
    MATHEMATICS FESTIVAL
  </text>

  <!-- Pi symbol decoration -->
  <text x="50" y="290" font-size="80" fill="rgba(253,230,138,0.07)"
        font-family="Georgia,serif">π</text>
  <text x="290" y="175" font-size="50" fill="rgba(253,230,138,0.06)"
        font-family="Georgia,serif">∑</text>

  <!-- Event title -->
  <text x="200" y="228" text-anchor="middle" font-size="22" fill="#ffffff"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">Hands-On Maths</text>
  <text x="200" y="254" text-anchor="middle" font-size="22" fill="#ffffff"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">for School Students</text>
  <text x="200" y="278" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.6)"
        font-family="'Helvetica Neue',Arial,sans-serif">Mysuru Edition</text>

  <!-- Info card -->
  <rect x="36" y="306" width="328" height="152" rx="14" fill="rgba(0,0,0,0.3)"/>
  <rect x="36" y="306" width="328" height="4" rx="2" fill="rgba(253,230,138,0.55)"/>

  <text x="200" y="338" text-anchor="middle" font-size="20" fill="#fde68a"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800">20 August 2026</text>
  <text x="200" y="360" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.6)"
        font-family="'Helvetica Neue',Arial,sans-serif">10:30 AM – 4:00 PM</text>

  <line x1="80" y1="374" x2="320" y2="374" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="200" y="396" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.9)"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600">Mysuru, Karnataka</text>
  <text x="200" y="416" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.45)"
        font-family="'Helvetica Neue',Arial,sans-serif">School TBD — registration required</text>

  <line x1="80" y1="430" x2="320" y2="430" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="200" y="450" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)"
        font-family="'Helvetica Neue',Arial,sans-serif">Puzzles, activities and maths games for all</text>

  <text x="200" y="484" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)"
        font-family="'Helvetica Neue',Arial,sans-serif">Tangible, joyful exploration of mathematics</text>
  <text x="200" y="500" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.38)"
        font-family="'Helvetica Neue',Arial,sans-serif">through objects, puzzles and school topics.</text>

  <line x1="60" y1="522" x2="340" y2="522" stroke="rgba(253,230,138,0.15)" stroke-width="1"/>
  <text x="200" y="540" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.3)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="1">trust@ias.ac.in · theacademytrust.org</text>

  <rect y="555" width="400" height="5" fill="#fde68a"/>
</svg>
