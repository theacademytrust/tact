<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0a4f38"/>
      <stop offset="1" stop-color="#0f5f45"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="15%" r="60%">
      <stop offset="0" stop-color="#f2c94c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="400" height="560" fill="url(#bg1)"/>
  <rect width="400" height="560" fill="url(#glow1)"/>

  <!-- Decorative circles -->
  <circle cx="370" cy="80" r="110" fill="rgba(255,255,255,0.04)"/>
  <circle cx="370" cy="80" r="70" fill="rgba(255,255,255,0.04)"/>
  <circle cx="30" cy="490" r="90" fill="rgba(255,255,255,0.03)"/>
  <circle cx="200" cy="560" r="130" fill="rgba(10,122,58,0.18)"/>

  <!-- Top accent bar -->
  <rect y="0" width="400" height="5" fill="#f2c94c"/>

  <!-- PREVIEW watermark band -->
  <rect y="12" width="400" height="22" fill="rgba(0,0,0,0.25)"/>
  <text x="200" y="27" text-anchor="middle" font-size="9" fill="rgba(255,220,80,0.85)"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" letter-spacing="4">
    EXAMPLE · PREVIEW ONLY · NOT A REAL EVENT
  </text>

  <!-- IAS logo text -->
  <text x="200" y="72" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.55)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="2.5" font-weight="500">
    INDIAN ACADEMY OF SCIENCES
  </text>
  <text x="200" y="90" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.8)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="2" font-weight="700">
    THE ACADEMY TRUST (tAcT)
  </text>

  <!-- Divider -->
  <line x1="60" y1="104" x2="340" y2="104" stroke="rgba(242,201,76,0.35)" stroke-width="1"/>

  <!-- Program name -->
  <text x="200" y="148" text-anchor="middle" font-size="26" fill="#f2c94c"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="1">
    VIJNANA HARATE
  </text>
  <text x="200" y="170" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.55)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="2">
    SCIENCE IN CONVERSATION
  </text>

  <!-- Large decorative quote mark -->
  <text x="52" y="250" font-size="120" fill="rgba(242,201,76,0.08)"
        font-family="Georgia,serif" font-weight="700">"</text>

  <!-- Event title -->
  <text x="200" y="232" text-anchor="middle" font-size="22" fill="#ffffff"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">Scientists Meet</text>
  <text x="200" y="260" text-anchor="middle" font-size="22" fill="#ffffff"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">School Students</text>
  <text x="200" y="285" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.65)"
        font-family="'Helvetica Neue',Arial,sans-serif">Bengaluru School Session</text>

  <!-- Info card -->
  <rect x="36" y="310" width="328" height="148" rx="14" fill="rgba(0,0,0,0.28)"/>
  <rect x="36" y="310" width="328" height="4" rx="2" fill="rgba(242,201,76,0.5)"/>

  <text x="200" y="342" text-anchor="middle" font-size="20" fill="#f2c94c"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800">10 June 2026</text>
  <text x="200" y="364" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.65)"
        font-family="'Helvetica Neue',Arial,sans-serif">10:00 AM – 1:00 PM</text>

  <line x1="80" y1="378" x2="320" y2="378" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <text x="200" y="400" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.9)"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600">Bengaluru, Karnataka</text>
  <text x="200" y="420" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)"
        font-family="'Helvetica Neue',Arial,sans-serif">Venue to be announced</text>

  <line x1="80" y1="434" x2="320" y2="434" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <text x="200" y="452" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.55)"
        font-family="'Helvetica Neue',Arial,sans-serif">Informal science session · Open to school students</text>

  <!-- Description blurb -->
  <text x="200" y="490" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.42)"
        font-family="'Helvetica Neue',Arial,sans-serif">Scientists engage students in relaxed conversations</text>
  <text x="200" y="506" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.42)"
        font-family="'Helvetica Neue',Arial,sans-serif">about research, careers, and everyday science.</text>

  <!-- Bottom -->
  <line x1="60" y1="524" x2="340" y2="524" stroke="rgba(242,201,76,0.2)" stroke-width="1"/>
  <text x="200" y="542" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.35)"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="1">trust@ias.ac.in · theacademytrust.org</text>

  <!-- Bottom accent bar -->
  <rect y="555" width="400" height="5" fill="#f2c94c"/>
</svg>
