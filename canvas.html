<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tAcT — The World We Work In</title>
  <style>
    :root {
      --g: #0a7a3a;
      --gd: #076830;
      --gold: #b8860b;
      --cream: #fdfcf7;
      --ink: #1a2820;
      --muted: #6b7a72;
      --card-bg: rgba(255,255,255,0.94);
      --card-border: rgba(10,122,58,0.13);
      --bubble-r: rgba(220,242,230,0.97);
      --bubble-l: rgba(255,255,255,0.97);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--cream);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      cursor: grab;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    body.panning { cursor: grabbing; }

    #bg {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    #stage {
      position: fixed;
      top: 0; left: 0;
      transform-origin: 0 0;
      z-index: 1;
    }

    /* ── connections ── */
    #cnx {
      position: absolute; top: 0; left: 0;
      overflow: visible;
      pointer-events: none;
    }

    /* ── world elements ── */
    .w {
      position: absolute;
    }

    /* ── hero ── */
    .hero {
      width: 420px;
      background: linear-gradient(148deg,#eaf4ef 0%,#fdfcf5 52%,#fdf5e0 100%);
      border: 2px solid rgba(184,134,11,0.28);
      border-radius: 28px;
      padding: 44px 48px;
      text-align: center;
      box-shadow: 0 24px 90px rgba(10,30,20,0.14), 0 4px 16px rgba(10,30,20,0.07);
    }
    .hero .org {
      font-size: 11px; font-weight: 800; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--g); margin-bottom: 14px;
    }
    .hero h1 {
      font-size: 28px; font-weight: 700; color: var(--g);
      line-height: 1.42; letter-spacing: -0.024em; margin: 0;
    }
    .hero h1 em { font-style: italic; color: rgba(184,134,11,0.9); }
    .hero .rule {
      width: 40px; height: 1.5px; border: none; margin: 16px auto;
      background: linear-gradient(90deg,transparent,rgba(184,134,11,0.6),transparent);
    }
    .hero .amp {
      font-size: 48px; font-weight: 300; font-style: italic;
      color: rgba(184,134,11,0.65); line-height: 1; display: block; margin: 6px 0;
    }
    .hero .since {
      margin-top: 18px; font-size: 12px; color: var(--muted);
      font-weight: 600; letter-spacing: 0.05em;
    }

    /* ── program cards ── */
    .prog {
      width: 300px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-top: 3px solid var(--gold);
      border-radius: 20px;
      padding: 20px 22px 18px;
      box-shadow: 0 8px 36px rgba(10,30,20,0.09), 0 2px 6px rgba(10,30,20,0.05);
    }
    .prog.green-top { border-top-color: var(--g); }
    .prog .kicker {
      font-size: 10px; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 6px;
    }
    .prog h2 {
      font-size: 17px; font-weight: 700; color: var(--g);
      letter-spacing: -0.02em; margin-bottom: 8px; line-height: 1.25;
    }
    .prog p {
      font-size: 12.5px; line-height: 1.65; color: #3a4a42; margin: 0;
    }
    .prog .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .tag {
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(10,122,58,0.08);
      border: 1px solid rgba(10,122,58,0.16);
      color: var(--g);
    }
    .tag.gold {
      background: rgba(184,134,11,0.08);
      border-color: rgba(184,134,11,0.2);
      color: #8a6508;
    }

    /* ── bubbles ── */
    .bubble {
      max-width: 250px;
      padding: 11px 14px 9px;
      border-radius: 16px 16px 16px 3px;
      border: 1px solid rgba(10,122,58,0.11);
      background: var(--bubble-l);
      box-shadow: 0 3px 12px rgba(10,30,20,0.07);
    }
    .bubble.r {
      border-radius: 16px 16px 3px 16px;
      background: var(--bubble-r);
    }
    .bubble .meta {
      font-size: 10px; font-weight: 800; color: var(--gold);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 3px;
    }
    .bubble p { font-size: 12px; line-height: 1.58; color: #253020; }
    .bubble .ts {
      font-size: 10px; color: #8a9a8a; margin-top: 4px; text-align: right;
    }

    /* ── stat chips ── */
    .stat {
      background: var(--g);
      color: #fff;
      border-radius: 16px;
      padding: 14px 18px;
      text-align: center;
      box-shadow: 0 8px 28px rgba(10,80,40,0.22);
      min-width: 100px;
    }
    .stat .num { font-size: 30px; font-weight: 800; line-height: 1; }
    .stat .lbl {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; opacity: 0.78; margin-top: 5px;
    }
    .stat.gold-stat { background: linear-gradient(135deg,#c9980e,#a07208); }

    /* ── section cards ── */
    .section-card {
      width: 280px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 6px 24px rgba(10,30,20,0.08);
    }
    .section-card h3 {
      font-size: 14px; font-weight: 700; color: var(--g);
      margin-bottom: 8px; letter-spacing: -0.01em;
    }
    .section-card p {
      font-size: 12px; line-height: 1.65; color: var(--muted);
    }
    .section-card ul {
      padding-left: 16px; margin: 6px 0 0;
    }
    .section-card ul li {
      font-size: 12px; line-height: 1.6; color: #3a4a42; margin-bottom: 3px;
    }

    /* ── partner logos ── */
    .partner-strip {
      width: 420px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(10,20,10,0.07);
      border-radius: 16px;
      padding: 16px 24px;
      box-shadow: 0 4px 20px rgba(10,30,20,0.07);
    }
    .partner-strip .ph {
      font-size: 10px; font-weight: 800; color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 12px; text-align: center;
    }
    .partner-strip .logos {
      display: flex; align-items: center; justify-content: space-around; gap: 16px;
    }
    .p-logo {
      font-size: 13px; font-weight: 800; color: var(--g);
      letter-spacing: 0.03em; opacity: 0.8;
    }

    /* ── floating text labels ── */
    .floatlabel {
      font-size: 13px; font-style: italic; color: rgba(10,122,58,0.4);
      font-weight: 500; pointer-events: none; white-space: nowrap;
    }
    .formula {
      font-size: 15px; font-style: italic; color: rgba(184,134,11,0.35);
      font-family: 'Georgia', serif; pointer-events: none; white-space: nowrap;
    }
    .kannada {
      font-size: 20px; color: rgba(10,122,58,0.25);
      pointer-events: none; letter-spacing: 0.04em;
    }
    .year-tag {
      font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; color: #fff;
      background: rgba(10,122,58,0.75);
      padding: 4px 11px; border-radius: 999px;
    }

    /* ── doodles ── */
    .doodle svg {
      display: block;
    }

    /* ── animations ── */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .float-anim { animation: float 6s ease-in-out infinite; }
    .float-anim-2 { animation: float 8s ease-in-out infinite 1s; }
    .float-anim-3 { animation: float 7s ease-in-out infinite 2s; }

    /* ── HUD ── */
    #hud {
      position: fixed; bottom: 28px; right: 28px; z-index: 999;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    #hud button {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid rgba(10,122,58,0.22);
      background: rgba(255,255,255,0.95);
      color: var(--g); font-size: 20px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(10,30,20,0.13);
      transition: transform 0.15s, box-shadow 0.15s;
      line-height: 1;
    }
    #hud button:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(10,30,20,0.2); }
    #hud .sep { width: 1px; height: 10px; background: rgba(10,122,58,0.2); }

    #hint {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      background: rgba(10,50,25,0.82); color: #fff;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      padding: 8px 18px; border-radius: 999px;
      pointer-events: none; transition: opacity 1.2s;
      backdrop-filter: blur(6px);
    }

    #zoom-label {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(10,122,58,0.2);
      font-size: 11px; font-weight: 700; color: var(--g);
      padding: 5px 13px; border-radius: 999px;
      pointer-events: none; transition: opacity 0.6s;
      backdrop-filter: blur(4px);
      letter-spacing: 0.06em;
    }

    #title-badge {
      position: fixed; top: 20px; left: 24px; z-index: 999;
      background: var(--g); color: #fff;
      font-size: 12px; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 8px 16px; border-radius: 12px;
      box-shadow: 0 4px 18px rgba(10,80,40,0.28);
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="stage">
    <svg id="cnx"></svg>
    <div id="world"></div>
  </div>

  <div id="title-badge">tAcT Canvas</div>

  <div id="hud">
    <button id="zin" title="Zoom in">+</button>
    <div class="sep"></div>
    <button id="zreset" title="Reset" style="font-size:14px">⌂</button>
    <div class="sep"></div>
    <button id="zout" title="Zoom out">−</button>
  </div>

  <div id="hint">Drag to explore &nbsp;·&nbsp; Scroll to zoom</div>
  <div id="zoom-label" style="opacity:0">100%</div>

  <script>
  /* ═══════════════════════════════════════════════════════
     BACKGROUND PATTERN  (WhatsApp-style repeating doodles)
  ═══════════════════════════════════════════════════════ */
  const bgCanvas = document.getElementById('bg');
  const bgCtx = bgCanvas.getContext('2d');

  const ICONS = [
    // atom
    (c,s) => {
      c.beginPath(); c.arc(0,0,s*0.17,0,Math.PI*2); c.stroke();
      c.save(); c.beginPath(); c.ellipse(0,0,s*0.45,s*0.17,0,0,Math.PI*2); c.stroke(); c.restore();
      c.save(); c.rotate(Math.PI/3); c.beginPath(); c.ellipse(0,0,s*0.45,s*0.17,0,0,Math.PI*2); c.stroke(); c.restore();
      c.save(); c.rotate(-Math.PI/3); c.beginPath(); c.ellipse(0,0,s*0.45,s*0.17,0,0,Math.PI*2); c.stroke(); c.restore();
    },
    // leaf
    (c,s) => {
      c.beginPath(); c.moveTo(0,-s*0.42); c.bezierCurveTo(s*0.32,-s*0.28,s*0.38,s*0.1,0,s*0.42);
      c.bezierCurveTo(-s*0.38,s*0.1,-s*0.32,-s*0.28,0,-s*0.42); c.stroke();
      c.beginPath(); c.moveTo(0,-s*0.42); c.lineTo(0,s*0.42); c.stroke();
    },
    // star 5pt
    (c,s) => {
      c.beginPath();
      for(let i=0;i<10;i++){
        const r=(i%2===0?s*0.43:s*0.18);
        const a=(i*Math.PI/5)-Math.PI/2;
        i===0?c.moveTo(Math.cos(a)*r,Math.sin(a)*r):c.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      c.closePath(); c.stroke();
    },
    // flask / erlenmeyer
    (c,s) => {
      c.beginPath();
      c.moveTo(-s*0.15,-s*0.42); c.lineTo(-s*0.15,-s*0.12);
      c.lineTo(-s*0.43,s*0.32); c.quadraticCurveTo(-s*0.44,s*0.44,-s*0.28,s*0.44);
      c.lineTo(s*0.28,s*0.44); c.quadraticCurveTo(s*0.44,s*0.44,s*0.43,s*0.32);
      c.lineTo(s*0.15,-s*0.12); c.lineTo(s*0.15,-s*0.42);
      c.stroke();
      c.beginPath(); c.moveTo(-s*0.18,-s*0.42); c.lineTo(s*0.18,-s*0.42); c.stroke();
    },
    // pi
    (c,s) => {
      c.beginPath(); c.moveTo(-s*0.38,-s*0.18); c.lineTo(s*0.38,-s*0.18); c.stroke();
      c.beginPath(); c.moveTo(-s*0.16,-s*0.18); c.bezierCurveTo(-s*0.18,s*0.1,-s*0.26,s*0.36,-s*0.3,s*0.44); c.stroke();
      c.beginPath(); c.moveTo(s*0.16,-s*0.18); c.bezierCurveTo(s*0.12,s*0.1,s*0.12,s*0.36,s*0.13,s*0.44); c.stroke();
    },
    // eighth note
    (c,s) => {
      c.beginPath(); c.ellipse(-s*0.08,s*0.28,s*0.17,s*0.12,Math.PI/6,0,Math.PI*2); c.stroke();
      c.beginPath(); c.moveTo(s*0.08,s*0.22); c.lineTo(s*0.08,-s*0.32); c.lineTo(s*0.38,-s*0.44); c.stroke();
    },
    // open book
    (c,s) => {
      c.beginPath();
      c.moveTo(0,-s*0.1); c.lineTo(0,s*0.42);
      c.moveTo(-s*0.42,-s*0.3); c.bezierCurveTo(-s*0.2,-s*0.36,s*0,-s*0.2,0,-s*0.1);
      c.bezierCurveTo(0,-s*0.2,s*0.2,-s*0.36,s*0.42,-s*0.3);
      c.lineTo(s*0.42,s*0.42); c.bezierCurveTo(s*0.2,s*0.36,0,s*0.44,0,s*0.42);
      c.bezierCurveTo(0,s*0.44,-s*0.2,s*0.36,-s*0.42,s*0.42); c.lineTo(-s*0.42,-s*0.3);
      c.stroke();
    },
    // lightbulb
    (c,s) => {
      c.beginPath(); c.arc(0,-s*0.1,s*0.3,0.75,Math.PI-0.75); c.stroke();
      c.beginPath(); c.moveTo(-s*0.3+s*0.3*Math.cos(Math.PI-0.75),-s*0.1+s*0.3*Math.sin(Math.PI-0.75));
      c.bezierCurveTo(-s*0.3,s*0.1,-s*0.2,s*0.32,-s*0.14,s*0.38); c.stroke();
      c.beginPath(); c.moveTo(s*0.3*Math.cos(0.75),-s*0.1+s*0.3*Math.sin(0.75));
      c.bezierCurveTo(s*0.3,s*0.1,s*0.2,s*0.32,s*0.14,s*0.38); c.stroke();
      c.beginPath(); c.moveTo(-s*0.14,s*0.38); c.lineTo(s*0.14,s*0.38); c.stroke();
      c.beginPath(); c.moveTo(-s*0.1,s*0.44); c.lineTo(s*0.1,s*0.44); c.stroke();
    },
    // dna strand
    (c,s) => {
      c.beginPath();
      for(let i=0;i<=20;i++){const y=(i/20)*s-s*0.5; const x=Math.sin(i/20*Math.PI*2)*s*0.24; if(i===0)c.moveTo(x,y); else c.lineTo(x,y);}
      c.stroke();
      c.beginPath();
      for(let i=0;i<=20;i++){const y=(i/20)*s-s*0.5; const x=-Math.sin(i/20*Math.PI*2)*s*0.24; if(i===0)c.moveTo(x,y); else c.lineTo(x,y);}
      c.stroke();
      for(let i=2;i<20;i+=5){const y=(i/20)*s-s*0.5; const x1=Math.sin(i/20*Math.PI*2)*s*0.24; c.beginPath();c.moveTo(x1,y);c.lineTo(-x1,y);c.stroke();}
    },
    // telescope
    (c,s) => {
      c.beginPath(); c.moveTo(-s*0.44,s*0.12); c.lineTo(s*0.44,-s*0.12); c.lineTo(s*0.44,s*0.08); c.lineTo(-s*0.3,s*0.32); c.closePath(); c.stroke();
      c.beginPath(); c.moveTo(s*0.02,s*0.18); c.lineTo(s*0.02,s*0.44); c.stroke();
      c.beginPath(); c.moveTo(-s*0.12,s*0.44); c.lineTo(s*0.16,s*0.44); c.stroke();
    },
    // magnifying glass
    (c,s) => {
      c.beginPath(); c.arc(-s*0.06,-s*0.1,s*0.28,0,Math.PI*2); c.stroke();
      c.beginPath(); c.moveTo(s*0.16,s*0.12); c.lineTo(s*0.44,s*0.44); c.stroke();
    },
    // infinity
    (c,s) => {
      c.beginPath();
      c.moveTo(0,0);
      c.bezierCurveTo(s*0.1,-s*0.26,s*0.46,-s*0.26,s*0.46,0);
      c.bezierCurveTo(s*0.46,s*0.26,s*0.1,s*0.26,0,0);
      c.bezierCurveTo(-s*0.1,-s*0.26,-s*0.46,-s*0.26,-s*0.46,0);
      c.bezierCurveTo(-s*0.46,s*0.26,-s*0.1,s*0.26,0,0);
      c.stroke();
    },
  ];

  let panX = 0, panY = 0, zoom = 1;

  function drawBg() {
    const W = bgCanvas.width = window.innerWidth;
    const H = bgCanvas.height = window.innerHeight;
    bgCtx.clearRect(0,0,W,H);
    bgCtx.fillStyle = '#fdfcf7';
    bgCtx.fillRect(0,0,W,H);

    const TILE = 88;
    const ox = ((panX * 0.12) % TILE + TILE) % TILE;
    const oy = ((panY * 0.12) % TILE + TILE) % TILE;

    bgCtx.save();
    bgCtx.globalAlpha = 0.062;
    bgCtx.strokeStyle = '#0a7a3a';
    bgCtx.lineWidth = 1.1;
    bgCtx.lineCap = 'round';
    bgCtx.lineJoin = 'round';

    let idx = 0;
    for(let x = ox - TILE; x < W + TILE; x += TILE) {
      for(let y = oy - TILE; y < H + TILE; y += TILE) {
        bgCtx.save();
        bgCtx.translate(x, y);
        const rot = ((x * 5 + y * 7) % 628) / 100;
        bgCtx.rotate(rot * 0.05);
        ICONS[idx % ICONS.length](bgCtx, TILE * 0.52);
        idx++;
        bgCtx.restore();
      }
    }
    bgCtx.restore();
  }

  /* ═══════════════════════════════════════════════════════
     PAN / ZOOM ENGINE
  ═══════════════════════════════════════════════════════ */
  const stage = document.getElementById('stage');
  const MIN_Z = 0.12, MAX_Z = 2.2;
  const WORLD_CX = 3600, WORLD_CY = 2700;
  const HOME_ZOOM = 0.68;

  function applyXform() {
    stage.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    drawBg();
    const zl = document.getElementById('zoom-label');
    zl.textContent = Math.round(zoom * 100) + '%';
  }

  function setHome() {
    zoom = HOME_ZOOM;
    panX = window.innerWidth / 2 - WORLD_CX * zoom;
    panY = window.innerHeight / 2 - WORLD_CY * zoom;
    applyXform();
  }

  let drag = false, lx = 0, ly = 0;
  document.addEventListener('mousedown', e => {
    drag = true; lx = e.clientX; ly = e.clientY;
    document.body.classList.add('panning');
  });
  document.addEventListener('mousemove', e => {
    if (!drag) return;
    panX += e.clientX - lx; panY += e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    applyXform();
  });
  document.addEventListener('mouseup', () => { drag = false; document.body.classList.remove('panning'); });

  document.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.91;
    const nz = Math.max(MIN_Z, Math.min(MAX_Z, zoom * factor));
    const mx = e.clientX, my = e.clientY;
    panX = mx - (mx - panX) * (nz / zoom);
    panY = my - (my - panY) * (nz / zoom);
    zoom = nz;
    const zl = document.getElementById('zoom-label');
    zl.style.opacity = '1';
    clearTimeout(zl._t);
    zl._t = setTimeout(() => zl.style.opacity = '0', 1200);
    applyXform();
  }, { passive: false });

  // Touch
  let touches = [], lastDist = 0;
  document.addEventListener('touchstart', e => {
    touches = [...e.touches];
    if (e.touches.length === 1) { lx = e.touches[0].clientX; ly = e.touches[0].clientY; drag = true; }
    if (e.touches.length === 2) { drag = false; lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
  });
  document.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && drag) {
      panX += e.touches[0].clientX - lx; panY += e.touches[0].clientY - ly;
      lx = e.touches[0].clientX; ly = e.touches[0].clientY; applyXform();
    }
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const f = d / lastDist; lastDist = d;
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const nz = Math.max(MIN_Z, Math.min(MAX_Z, zoom * f));
      panX = mx - (mx - panX) * (nz / zoom); panY = my - (my - panY) * (nz / zoom); zoom = nz; applyXform();
    }
  }, { passive: false });
  document.addEventListener('touchend', () => { drag = false; });

  document.getElementById('zin').addEventListener('click', () => {
    const nz = Math.min(MAX_Z, zoom * 1.25);
    panX = window.innerWidth/2 - (window.innerWidth/2 - panX) * (nz/zoom);
    panY = window.innerHeight/2 - (window.innerHeight/2 - panY) * (nz/zoom);
    zoom = nz; applyXform();
  });
  document.getElementById('zout').addEventListener('click', () => {
    const nz = Math.max(MIN_Z, zoom * 0.8);
    panX = window.innerWidth/2 - (window.innerWidth/2 - panX) * (nz/zoom);
